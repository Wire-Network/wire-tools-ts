name: "Tag Release"

# Gate 2 of the two-gate release flow (see prepare-release.yaml). The job runs
# under the `release` Environment, so it PAUSES for a required reviewer before it
# creates anything. Before that gate, the `resolve` job reads the version the
# merged prepare PR put on master and the `package-app` jobs build the WIRE QL
# desktop app installers (@wireio/ql-tool-app: Linux AppImage + deb, macOS dmg for
# arm64 + x64, Windows nsis — unsigned) on one runner per OS from that same
# commit. After approval the `tag` job runs the build/test gate, publishes every
# non-private workspace package to npm on the version's channel (ql-shared and
# ql-tool-cli included; ql-tool-app is private and ships only as installers),
# tags the commit, and publishes a GitHub release with the installers attached.
# Nothing is pushed to master here, so wire-platform-ruleset-1 needs no bypass —
# its rules target branches only, so the tag stays legal.
#
# The release version is whatever master currently carries. Its suffix IS the
# channel: no suffix => stable => npm dist-tag `latest`; a `-<preid>.N` suffix =>
# that preid is the dist-tag (e.g. dev, rc). The two human gates (the release-PR
# merge + the release Environment's required reviewers) are the safety, not a
# typed version.
#
# `dry_run` (manual dispatch only) runs the whole flow against the DISPATCHED ref
# instead of master and changes nothing: an existing tag is a warning, the tag
# job runs without the release Environment, npm publish runs with --dry-run, and
# the tag + release steps only report what they would create. The installers stay
# downloadable as the run's ql-tool-app-* artifacts.

on:
  # Auto-triggered when a release/prep-v* PR merges to master — the human
  # merge is gate 1; the `release` Environment's required reviewers are gate 2
  # (an org-configuration action of this change — the environment ships with
  # no protection rules). The merge must be performed by a HUMAN: an
  # auto-merge or any GITHUB_TOKEN-driven merge is suppressed by GitHub and
  # fires no run — use workflow_dispatch (the standing manual/recovery path)
  # if that ever changes. `pull_request closed` fires for every PR; the
  # job-level `if` below skips everything but merged, same-repo release-prep
  # PRs (skipped runs on ordinary merges are cosmetic noise).
  pull_request:
    types: [closed]
    branches: [master]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build, test and package the dispatched ref without publishing, tagging or releasing"
        type: boolean
        default: false

permissions:
  contents: write # create the tag + the GitHub release

defaults:
  run:
    shell: bash

concurrency:
  group: tag-release
  cancel-in-progress: false

jobs:
  resolve:
    name: Resolve the release version
    # Manual dispatch, or a MERGED, SAME-REPO release-prep PR — everything
    # else (unmerged closes, non-release branches, fork PRs whose head happens
    # to be named release/prep-v*) skips, and every job below skips with it.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.merged == true &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.event.pull_request.head.ref, 'release/prep-v'))
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      DRY_RUN: ${{ inputs.dry_run == true }}
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      tag: ${{ steps.resolve.outputs.tag }}
      sha: ${{ steps.resolve.outputs.sha }}
      prerelease: ${{ steps.resolve.outputs.prerelease }}
      dist_tag: ${{ steps.resolve.outputs.dist_tag }}
    steps:
      # A real release always comes from master; a dry run tests the ref it was
      # dispatched on.
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ inputs.dry_run == true && github.sha || 'master' }}
          fetch-depth: 0

      - name: Resolve the release version and channel
        id: resolve
        run: |
          set -euo pipefail

          # cluster-tool names the release, the same representative package
          # prepare-release.yaml bumps and reports. The other packages publish on
          # their own tracks in the same run; they are not the headline number.
          version="$(node -p "require('./packages/cluster-tool/package.json').version")"

          # The suffix IS the channel -> npm dist-tag. No suffix => latest; a
          # `-<preid>.N` suffix => that preid (dev, rc, ...).
          if [[ "$version" == *-* ]]; then
            prerelease="true"
            suffix="${version#*-}"
            dist_tag="${suffix%%.*}"
          else
            prerelease="false"
            dist_tag="latest"
          fi

          tag="v${version}"
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${tag}" >/dev/null 2>&1; then
            if [[ "$DRY_RUN" == "true" ]]; then
              echo "::warning::Tag ${tag} already exists; a real release would stop here."
            else
              echo "::error::Tag ${tag} already exists. Prepare the next bump instead of re-tagging." >&2
              exit 1
            fi
          fi

          {
            echo "version=$version"
            echo "tag=$tag"
            echo "sha=$(git rev-parse HEAD)"
            echo "prerelease=$prerelease"
            echo "dist_tag=$dist_tag"
          } >> "$GITHUB_OUTPUT"

          echo "Releasing ${tag} on $(git rev-parse HEAD) (npm dist-tag ${dist_tag}, dry run: ${DRY_RUN})"


  # One installer build per OS, all from the resolved commit. electron-builder
  # only builds a platform's installers on that platform (dmg needs macOS,
  # nsis is built natively on Windows), so this is a matrix of three runners.
  # Only ql-tool-app's own workspace dependencies are built: the webpack
  # bundles in dist/app consume @wireio/ql-shared's lib/ output.
  package-app:
    name: Package ql-tool-app (${{ matrix.platform }})
    needs: resolve
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: linux
            runner: ubuntu-latest
            installers: |
              packages/ql-tool-app/dist/package/*.AppImage
              packages/ql-tool-app/dist/package/*.deb
          - platform: mac
            runner: macos-latest
            installers: |
              packages/ql-tool-app/dist/package/*.dmg
          - platform: win
            runner: windows-latest
            installers: |
              packages/ql-tool-app/dist/package/*.exe
    runs-on: ${{ matrix.runner }}
    env:
      # No code signing yet: never look up a signing identity in the runner's
      # keychain / certificate store.
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ needs.resolve.outputs.sha }}

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24

      - name: Install and build the app's workspace dependencies
        run: |
          pnpm install
          pnpm --filter "@wireio/ql-shared..." run build

      # package:<platform> downloads the Electron binary (setup:electron), builds
      # the webpack bundles and runs electron-builder for this OS's targets.
      - name: Build the ${{ matrix.platform }} installers
        run: pnpm --filter @wireio/ql-tool-app run "package:${{ matrix.platform }}"

      - name: Upload the installers
        uses: actions/upload-artifact@v4
        with:
          name: ql-tool-app-${{ matrix.platform }}
          path: ${{ matrix.installers }}
          if-no-files-found: error

  tag:
    name: Tag and publish
    needs: [resolve, package-app]
    runs-on: ubuntu-latest
    # Required reviewers on this Environment are gate 2 — nothing below runs until
    # a human approves the deployment. A dry run changes nothing, so it runs
    # without the Environment (an empty name means no environment).
    environment: ${{ inputs.dry_run != true && 'release' || '' }}
    env:
      GH_TOKEN: ${{ github.token }}
      DRY_RUN: ${{ inputs.dry_run == true }}
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      # Fetched before anything irreversible, so a missing installer stops the
      # release before npm or the tag are touched.
      - name: Download the ql-tool-app installers
        uses: actions/download-artifact@v4
        with:
          pattern: ql-tool-app-*
          path: release-assets
          merge-multiple: true

      # Gate the release on the same install/build + root jest run ci.yaml uses.
      - name: Install, build and test
        env:
          JEST_JUNIT_OUTPUT_DIR: reports/junit
          JEST_JUNIT_OUTPUT_NAME: jest-junit.xml
        run: |
          # Double install kept from the old release workflow: the workspace
          # `prepare` scripts build packages during install, and the second
          # install re-links workspace bins against the built output.
          pnpm install
          pnpm build
          pnpm install
          pnpm run build
          # Root jest only (8 projects). NEVER `pnpm -r test` here — flow-*
          # package test scripts launch live clusters.
          pnpm run test:ci

      - name: Upload test results (JUnit XML)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-test-results
          path: reports/junit/
          if-no-files-found: ignore

      # npm is the irreversible step — do it once the gate is green, BEFORE
      # tagging, so a failed publish leaves no dangling tag to trip the
      # "tag already exists" guard on the retry.
      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          DIST_TAG: ${{ needs.resolve.outputs.dist_tag }}
        run: |
          # Publishes all non-private workspace packages (including
          # @wireio/ql-shared and @wireio/ql-tool-cli) in dependency order on
          # the channel's dist-tag; `workspace:*` deps are rewritten to concrete
          # versions. --no-git-checks avoids failure in CI environments. No
          # --provenance: npm provenance requires a public source repo and this
          # repo is private. A dry run packs every package without uploading.
          args=(--access public --no-git-checks --tag "$DIST_TAG")
          if [[ "$DRY_RUN" == "true" ]]; then
            args+=(--dry-run)
          fi
          pnpm -r publish "${args[@]}"

      - name: Create the annotated tag
        if: ${{ inputs.dry_run != true }}
        env:
          TAG: ${{ needs.resolve.outputs.tag }}
          SHA: ${{ needs.resolve.outputs.sha }}
        run: |
          set -euo pipefail
          # An annotated tag is TWO API calls in order: the tag object, then the
          # ref that points at it. `gh release create --verify-tag` needs the ref.
          tag_sha="$(
            gh api "repos/${GITHUB_REPOSITORY}/git/tags" -X POST \
              -f tag="$TAG" -f message="$TAG" -f object="$SHA" -f type=commit --jq .sha
          )"
          gh api "repos/${GITHUB_REPOSITORY}/git/refs" -X POST \
            -f ref="refs/tags/${TAG}" -f sha="$tag_sha" > /dev/null
          echo "Created annotated tag ${TAG} -> ${SHA}"

      - name: Publish the GitHub release
        if: ${{ inputs.dry_run != true }}
        env:
          TAG: ${{ needs.resolve.outputs.tag }}
          PRERELEASE: ${{ needs.resolve.outputs.prerelease }}
        run: |
          set -euo pipefail
          args=(--verify-tag --title "$TAG" --generate-notes)
          if [[ "$PRERELEASE" == "true" ]]; then
            args+=(--prerelease)
          fi
          # Every installer the package-app jobs built is attached to the release.
          gh release create "$TAG" release-assets/* "${args[@]}"

      # gh has no dry-run mode for `release create`, so a dry run lists the tag and
      # the release it would create, with every installer it would attach.
      - name: Report the release a real run would publish
        if: ${{ inputs.dry_run == true }}
        env:
          TAG: ${{ needs.resolve.outputs.tag }}
          SHA: ${{ needs.resolve.outputs.sha }}
          PRERELEASE: ${{ needs.resolve.outputs.prerelease }}
        run: |
          set -euo pipefail
          {
            echo "## Dry run: nothing was published"
            echo
            echo "- Tag: \`${TAG}\` -> \`${SHA}\`"
            echo "- Prerelease: ${PRERELEASE}"
            echo "- Installers that would be attached (also this run's ql-tool-app-* artifacts):"
            echo
            echo '```'
            ls -l release-assets/
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
