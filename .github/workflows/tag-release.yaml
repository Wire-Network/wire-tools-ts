name: "Tag Release"

# Gate 2 of the two-gate release flow (see prepare-release.yaml). The job runs
# under the `release` Environment, so it PAUSES for a required reviewer before it
# creates anything. After approval it reads the version the merged prepare PR put
# on master, runs the build/test gate, publishes every non-private workspace
# package to npm on the version's channel, tags master, and publishes a GitHub
# release. Nothing is pushed to master here, so wire-platform-ruleset-1 needs no
# bypass — its rules target branches only, so the tag stays legal.
#
# No inputs: the release version is whatever master currently carries. Its suffix
# IS the channel: no suffix => stable => npm dist-tag `latest`; a `-<preid>.N`
# suffix => that preid is the dist-tag (e.g. dev, rc). The two human gates
# (the release-PR merge + the release Environment's required reviewers) are the
# safety, not a typed version.

on:
  # Auto-triggered when a release/prep-v* PR merges to master — the human
  # merge is gate 1; the `release` Environment's required reviewers are gate 2
  # (an org-configuration action of this change — the environment ships with
  # no protection rules). The merge must be performed by a HUMAN: an
  # auto-merge or any GITHUB_TOKEN-driven merge is suppressed by GitHub and
  # fires no run — use workflow_dispatch (the standing manual/recovery path)
  # if that ever changes. `pull_request closed` fires for every PR; the
  # job-level `if` below skips everything but merged, same-repo release-prep
  # PRs (skipped runs on ordinary merges are cosmetic noise).
  pull_request:
    types: [closed]
    branches: [master]
  workflow_dispatch: {}

permissions:
  contents: write # create the tag + the GitHub release

defaults:
  run:
    shell: bash

concurrency:
  group: tag-release
  cancel-in-progress: false

jobs:
  tag:
    name: Tag master and publish
    # Manual dispatch, or a MERGED, SAME-REPO release-prep PR — everything
    # else (unmerged closes, non-release branches, fork PRs whose head happens
    # to be named release/prep-v*) skips.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.merged == true &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.event.pull_request.head.ref, 'release/prep-v'))
    runs-on: ubuntu-latest
    # Required reviewers on this Environment are gate 2 — nothing below runs until
    # a human approves the deployment.
    environment: release
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: master
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Resolve the release version and channel from master
        id: resolve
        run: |
          set -euo pipefail

          # cluster-tool names the release, the same representative package
          # prepare-release.yaml bumps and reports. The other packages publish on
          # their own tracks in the same run; they are not the headline number.
          version="$(node -p "require('./packages/cluster-tool/package.json').version")"

          # The suffix IS the channel -> npm dist-tag. No suffix => latest; a
          # `-<preid>.N` suffix => that preid (dev, rc, ...).
          if [[ "$version" == *-* ]]; then
            prerelease="true"
            suffix="${version#*-}"
            dist_tag="${suffix%%.*}"
          else
            prerelease="false"
            dist_tag="latest"
          fi

          tag="v${version}"
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${tag}" >/dev/null 2>&1; then
            echo "::error::Tag ${tag} already exists. Prepare the next bump instead of re-tagging." >&2
            exit 1
          fi

          {
            echo "version=$version"
            echo "tag=$tag"
            echo "sha=$(git rev-parse HEAD)"
            echo "prerelease=$prerelease"
            echo "dist_tag=$dist_tag"
          } >> "$GITHUB_OUTPUT"

          echo "Releasing ${tag} on $(git rev-parse HEAD) (npm dist-tag ${dist_tag})"

      # Gate the release on the same install/build + root jest run ci.yaml uses.
      - name: Install, build and test
        env:
          JEST_JUNIT_OUTPUT_DIR: reports/junit
          JEST_JUNIT_OUTPUT_NAME: jest-junit.xml
        run: |
          # Double install kept from the old release workflow: the workspace
          # `prepare` scripts build packages during install, and the second
          # install re-links workspace bins against the built output.
          pnpm install
          pnpm build
          pnpm install
          pnpm run build
          # Root jest only (8 projects). NEVER `pnpm -r test` here — flow-*
          # package test scripts launch live clusters.
          pnpm run test:ci

      - name: Upload test results (JUnit XML)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-test-results
          path: reports/junit/
          if-no-files-found: ignore

      # npm is the irreversible step — do it once the gate is green, BEFORE
      # tagging, so a failed publish leaves no dangling tag to trip the
      # "tag already exists" guard on the retry.
      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          DIST_TAG: ${{ steps.resolve.outputs.dist_tag }}
        run: |
          # Publishes all non-private workspace packages in dependency order on
          # the channel's dist-tag; `workspace:*` deps are rewritten to concrete
          # versions. --no-git-checks avoids failure in CI environments. No
          # --provenance: npm provenance requires a public source repo and this
          # repo is private.
          pnpm -r publish --access public --no-git-checks --tag "$DIST_TAG"

      - name: Create the annotated tag
        env:
          TAG: ${{ steps.resolve.outputs.tag }}
          SHA: ${{ steps.resolve.outputs.sha }}
        run: |
          set -euo pipefail
          # An annotated tag is TWO API calls in order: the tag object, then the
          # ref that points at it. `gh release create --verify-tag` needs the ref.
          tag_sha="$(
            gh api "repos/${GITHUB_REPOSITORY}/git/tags" -X POST \
              -f tag="$TAG" -f message="$TAG" -f object="$SHA" -f type=commit --jq .sha
          )"
          gh api "repos/${GITHUB_REPOSITORY}/git/refs" -X POST \
            -f ref="refs/tags/${TAG}" -f sha="$tag_sha" > /dev/null
          echo "Created annotated tag ${TAG} -> ${SHA}"

      - name: Publish the GitHub release
        env:
          TAG: ${{ steps.resolve.outputs.tag }}
          PRERELEASE: ${{ steps.resolve.outputs.prerelease }}
        run: |
          set -euo pipefail
          args=(--verify-tag --title "$TAG" --generate-notes)
          if [[ "$PRERELEASE" == "true" ]]; then
            args+=(--prerelease)
          fi
          gh release create "$TAG" "${args[@]}"
