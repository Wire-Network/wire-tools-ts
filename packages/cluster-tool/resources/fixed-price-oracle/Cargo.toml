[package]
name = "wire-fixed-price-oracle"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "lib"]

[dependencies]
borsh = "0.10.4"
chainlink_solana = { git = "https://github.com/smartcontractkit/chainlink-solana", rev = "edeaa2d8d1c4c53775ec16f40095184f60647f4a" }
solana-program = "=2.3.0"

[features]
custom-heap = []
custom-panic = []

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
